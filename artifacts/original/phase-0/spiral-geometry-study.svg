<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Spiral Conduction geometry study</title>
  <desc id="desc">Top-down comparison of 2.25, 2.5, and 2.75-turn Archimedean spirals, with 2.5 turns recommended.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e1112"/><stop offset=".58" stop-color="#1a2020"/><stop offset="1" stop-color="#14090f"/></linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#394344"/><stop offset=".45" stop-color="#202728"/><stop offset="1" stop-color="#101415"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#8a9797"/></marker>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1800" height="1000" fill="url(#bg)"/>
  <rect width="1800" height="1000" fill="url(#grid)"/>
