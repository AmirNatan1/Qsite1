  <g font-family="Arial, sans-serif">
    <text x="84" y="102" fill="#8a9797" font-size="18" font-weight="700" letter-spacing="3">VIEW 03 · ACTIVATION + PORTAL · 92%</text>
    <text x="84" y="166" fill="#fff" font-family="Arial Black, Arial, sans-serif" font-size="50" letter-spacing="-2">Power, not decoration.</text>
    <text x="84" y="208" fill="#c2cbcb" font-family="Georgia, serif" font-size="23">Connector response, one internal path, restrained Q-interface wake.</text>
    <rect x="84" y="258" width="520" height="150" rx="18" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".1"/>
    <text x="112" y="302" fill="#f7aeca" font-size="15" font-weight="700" letter-spacing="2">PORTAL RELATIONSHIP</text>
    <text x="112" y="340" fill="#c2cbcb" font-size="18">Q-yoke and operating surface share one aperture.</text>
    <text x="112" y="372" fill="#c2cbcb" font-size="18">No laptop bezel. No generic circle. No blank bridge.</text>
    <text x="1960" y="1980" text-anchor="end" fill="#8a9797" font-size="16">2048×2048 · original vector concept</text>
